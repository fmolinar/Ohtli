frr version 9.1
frr defaults traditional
hostname pe1
log stdout
no ipv6 forwarding
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description link-to-p1
 ip address 10.0.0.0/31
!
interface eth2
 description link-to-p2
 ip address 10.0.0.2/31
!
interface eth3
 description link-to-client-a
 ip address 192.0.2.1/24
!
ip prefix-list CLIENT-A seq 5 permit 192.0.2.0/24
!
route-map RM-CLIENT permit 10
 match ip address prefix-list CLIENT-A
!
router ospf
 ospf router-id 10.255.0.1
 network 10.255.0.1/32 area 0
 network 10.0.0.0/31 area 0
 network 10.0.0.2/31 area 0
 passive-interface lo
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor PROVIDER peer-group
 neighbor PROVIDER remote-as 65000
 neighbor PROVIDER update-source lo
 neighbor PROVIDER next-hop-self
 neighbor 10.255.0.2 peer-group PROVIDER
 neighbor 10.255.0.3 peer-group PROVIDER
 neighbor 10.255.0.4 peer-group PROVIDER
 !
 address-family ipv4 unicast
  redistribute connected route-map RM-CLIENT
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.4 activate
 exit-address-family
!
line vty
!
