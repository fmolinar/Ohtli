---
# Static example inventory.
#
# `lab_host` targets the Terraform-provisioned VM (terraform/environments/lab)
# over real SSH -- replace `ansible_host` with that module's `lab_host_ip`
# output, or regenerate this file from `terraform output -json` in CI.
#
# `routers` targets the Containerlab FRR nodes. These containers don't expose
# SSH/NETCONF management yet (tracked for when a gNMI-capable target such as
# SR Linux is introduced, per README.md section 4), so the frr_baseline role
# runs with `ansible_connection: local` and templates config directly into
# topology/configs/<node>/, which Containerlab bind-mounts into the
# container at deploy time.
all:
  children:
    lab_host:
      hosts:
        lab-host:
          ansible_host: 203.0.113.10  # CHANGE ME: terraform output lab_host_ip
          ansible_user: ubuntu  # CHANGE ME: terraform output lab_host_ssh_user

    routers:
      hosts:
        pe1:
          ansible_connection: local
        p1:
          ansible_connection: local
        p2:
          ansible_connection: local
        pe2:
          ansible_connection: local
