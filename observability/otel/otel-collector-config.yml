receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

service:
  # Collector self-telemetry (scraped by Prometheus as the "otel-collector"
  # job in prometheus.yml) stays on its default of :8888.
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      # No trace backend deployed yet (README.md doesn't call for one) --
      # debug-only until that changes.
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, debug]
